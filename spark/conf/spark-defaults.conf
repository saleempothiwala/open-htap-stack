spark.master                     spark://spark:7077
spark.driver.extraClassPath       /opt/analytics/jars/*
spark.executor.extraClassPath     /opt/analytics/jars/*

# Override Cassandra version detection for 5.1-SNAPSHOT compatibility
# The Analytics connector doesn't support 5.1-SNAPSHOT yet, but it's compatible with 5.0
spark.driver.extraJavaOptions     -Dcassandra.releaseVersion=5.0.6 -Dcassandra.analytics.bridges.sstable_format=bti
spark.executor.extraJavaOptions   -Dcassandra.releaseVersion=5.0.6 -Dcassandra.analytics.bridges.sstable_format=bti

# Ivy cache configuration for --packages
spark.jars.ivy                    /opt/spark/work-dir/.ivy2
