spark.master                     spark://spark:7077

spark.driver.extraJavaOptions     -Dcassandra.releaseVersion=5.0.6 -Dcassandra.analytics.bridges.sstable_format=bti
spark.executor.extraJavaOptions   -Dcassandra.releaseVersion=5.0.6 -Dcassandra.analytics.bridges.sstable_format=bti

# Ivy cache configuration for --packages
spark.jars.ivy                    /opt/spark/work-dir/.ivy2

spark.sql.warehouse.dir /tmp/spark-warehouse
javax.jdo.option.ConnectionURL jdbc:derby:;databaseName=/tmp/metastore_db;create=true

# cassandra spark bulk writer needs KryoSerializer
spark.serializer    org.apache.spark.serializer.KryoSerializer

# Cassandra connector JARs — loaded by Thrift Server and all spark-submit jobs
spark.jars                        /opt/spark/work-dir/.ivy2/cache/com.datastax.spark/spark-cassandra-connector_2.12/jars/spark-cassandra-connector_2.12-3.5.1.jar,/opt/spark/work-dir/.ivy2/cache/com.datastax.spark/spark-cassandra-connector-driver_2.12/jars/spark-cassandra-connector-driver_2.12-3.5.1.jar,/opt/spark/work-dir/.ivy2/cache/org.apache.cassandra/java-driver-core-shaded/jars/java-driver-core-shaded-4.18.1.jar,/opt/spark/work-dir/.ivy2/cache/com.datastax.oss/native-protocol/bundles/native-protocol-1.5.1.jar

# Cassandra connector must also be on driver + executor classpaths for Thrift Server sessions
spark.driver.extraClassPath       /opt/spark/work-dir/.ivy2/cache/com.datastax.spark/spark-cassandra-connector_2.12/jars/spark-cassandra-connector_2.12-3.5.1.jar:/opt/spark/work-dir/.ivy2/cache/com.datastax.spark/spark-cassandra-connector-driver_2.12/jars/spark-cassandra-connector-driver_2.12-3.5.1.jar:/opt/spark/work-dir/.ivy2/cache/org.apache.cassandra/java-driver-core-shaded/jars/java-driver-core-shaded-4.18.1.jar:/opt/spark/work-dir/.ivy2/cache/com.datastax.oss/native-protocol/bundles/native-protocol-1.5.1.jar
spark.executor.extraClassPath     /opt/spark/work-dir/.ivy2/cache/com.datastax.spark/spark-cassandra-connector_2.12/jars/spark-cassandra-connector_2.12-3.5.1.jar:/opt/spark/work-dir/.ivy2/cache/com.datastax.spark/spark-cassandra-connector-driver_2.12/jars/spark-cassandra-connector-driver_2.12-3.5.1.jar:/opt/spark/work-dir/.ivy2/cache/org.apache.cassandra/java-driver-core-shaded/jars/java-driver-core-shaded-4.18.1.jar:/opt/spark/work-dir/.ivy2/cache/com.datastax.oss/native-protocol/bundles/native-protocol-1.5.1.jar

# Cassandra connection defaults for all Spark sessions (incl. Thrift Server)
spark.cassandra.connection.host   cassandra
spark.cassandra.connection.port   9042